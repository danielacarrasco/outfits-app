<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Seam Wardrobe{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="site">
  <div class="brand">
    Seam
    <small>Wardrobe</small>
  </div>
  <nav>
    <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Home</a>
    <a href="/wardrobe" {% if request.url.path.startswith('/wardrobe') %}class="active"{% endif %}>Wardrobe</a>
    <a href="/planner" {% if request.url.path.startswith('/planner') %}class="active"{% endif %}>Planner</a>
    <a href="/outfits" {% if request.url.path.startswith('/outfits') %}class="active"{% endif %}>Outfits</a>
    <a href="/gaps" {% if request.url.path.startswith('/gaps') %}class="active"{% endif %}>Gaps</a>
    <a href="/preferences" {% if request.url.path.startswith('/preferences') %}class="active"{% endif %}>Profile</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer class="site">A modern personal atelier · Seam</footer>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
